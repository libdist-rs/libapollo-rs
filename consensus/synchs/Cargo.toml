[package]
name = "synchs"
version = "0.1.0"
authors = ["hermitsage <dth.bht@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
config = { package = "config", path="../../config"}
consensus = { package = "consensus", path="../"}
types = { package = "types", path="../../types"}
libcrypto = { git = "https://github.com/libdist-rs/libcrypto-rs.git" }
bincode = "1"
util = { package = "util", path="../../util"}
tokio = { version = "1.0", features = ["full"] }
futures = "^0.3"
bytes = "1.0"
tokio-util = { version = "0.6", features = ["time"] }
tokio-stream = "0.1"
serde = "1.0.70"
log="*"
priority-queue="1"
fnv = "1"

# libnet-rs: direct TLS reliable-sender / receiver integration.
# `tcp-sender` covers the (plain) client->mempool submission path.
net-common = { package = "common", git = "https://github.com/libdist-rs/libnet-rs.git", features = ["tls"] }
tls-reliable-sender = { git = "https://github.com/libdist-rs/libnet-rs.git" }
tls-receiver = { git = "https://github.com/libdist-rs/libnet-rs.git" }
tcp-sender = { git = "https://github.com/libdist-rs/libnet-rs.git" }

# libapollo-mempool: in-tree Narwhal-style batching (purpose-built)
libmempool = { package = "libapollo-mempool", path = "../../mempool" }
libstorage = { package = "libstorage-rs", git = "https://github.com/libdist-rs/libstorage-rs.git" }
