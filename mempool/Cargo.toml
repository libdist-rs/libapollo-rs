[package]
name = "libapollo-mempool"
version = "0.1.0"
authors = ["hermitsage <dth.bht@gmail.com>"]
edition = "2018"
description = "Purpose-built mempool for libapollo-rs. Narwhal-style leader-inlines-batch over libnet-rs + libstorage-rs, with cached batch hashes, pre-hashed txs, and in-memory batch cache."

[dependencies]
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "macros"] }
tokio-stream = "0.1"
futures = "0.3"
log = "0.4"
dashmap = "5"
anyhow = "1"
fnv = "1"

libcrypto = { git = "https://github.com/libdist-rs/libcrypto-rs.git" }
libstorage = { package = "libstorage-rs", git = "https://github.com/libdist-rs/libstorage-rs.git" }
net-common = { package = "common", git = "https://github.com/libdist-rs/libnet-rs.git" }
tcp-receiver = { git = "https://github.com/libdist-rs/libnet-rs.git" }
tcp-sender = { git = "https://github.com/libdist-rs/libnet-rs.git" }
