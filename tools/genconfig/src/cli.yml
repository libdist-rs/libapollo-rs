name: genconfig
version: "1.0"
author: hermitsage <dth.bht@gmail.com>
about: Generate config files for all the protocols
args:
    - num_nodes:
        short: n
        long: NumNodes
        value_name: integer
        help: specify the number of nodes in the protocol
        takes_value: true
        required: true
    - delay:
        short: d
        long: delay
        help: specify the worst case network delay (in milliseconds)
        takes_value: true
        required: true
    - block_size:
        short: b
        long: blocksize
        help: specify the number of commands per block
        takes_value: true
        required: true
    - client_base_port:
        short: C
        long: client_base_port
        help: the base port p such that the node i listens to client requests and transactions on port p+i
        takes_value: true
        required: true
    - base_port:
        short: P
        long: base_port
        help: the base port p such that the node i listens to other nodes on port p+i
        takes_value: true
        required: true
    - crypto:
        short: A
        long: algorithm
        help: 'Cryptographic public key algorithm to use: ED25519(default) or SECP256K1'
        possible_values:
          - ED25519
          - SECP256K1
        takes_value: true
    - num_faults:
        short: f
        long: faults
        help: number of faulty nodes, default is (n-1)/2
        takes_value: true
    - out_type:
        short: o
        long: out_type
        help: config file format; binary or json (default)
        possible_values:
          - json
          - binary
          - toml
          - yaml
        takes_value: true
    - target:
        short: t
        long: target
        help: a directory to output the configurations files
        takes_value: true
    - payload:
        short: l
        long: payload
        help: the amount of payload to send in every block
        takes_value: true
    - client_listen_port:
        short: L
        long: client_listen_port
        help: base port p such that client j listens on p+j for node-pushed ClientMsg
        takes_value: true
        required: true
    - num_clients:
        short: c
        long: num_clients
        help: "number of distinct client identities to mint (default 1). Each gets its own client_id, listen port (client_listen_port+j), and TLS cert pair."
        takes_value: true
        required: false
    - mempool_base_port:
        short: M
        long: mempool_base_port
        help: base port p for the mempool peer-sync socket; node i binds p+i
        takes_value: true
        required: true
    - node_ips:
        short: I
        long: node_ips
        help: "comma-separated list of peer IP addresses to include in each node's TLS cert SAN. Use when nodes aren't on localhost (e.g. multi-VM benchmark). The SAN always also includes 127.0.0.1, localhost, nodes.com."
        takes_value: true
        required: false
    - client_ips:
        short: K
        long: client_ips
        help: "comma-separated list of client IP addresses to include in the client's TLS cert SAN. Same rule as --node_ips for the stress-test client."
        takes_value: true
        required: false