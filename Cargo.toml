[workspace]
resolver = "2"
members = [
    "types",
    "config",
    "util",
    "mempool",
    "consensus",
    "consensus/apollo",
    "consensus/artemis",
    "consensus/synchs",
    "consensus/optsync",
    "examples/apollo/node",
    "examples/apollo/client",
    "examples/apollo/normal-client",
    "examples/artemis/node",
    "examples/artemis/client",
    "examples/synchs/node",
    "examples/synchs/client",
    "examples/optsync/node",
    "examples/optsync/client",
    "tools/genconfig",
    "stress-test",
]

# Profile for samply / flamegraph / Instruments runs. Keeps release
# optimizations but emits debug info so the sample->function symbol
# resolution works end-to-end through our deps. `strip = "none"` is
# the default, spelled out here for the profiling use-case.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
